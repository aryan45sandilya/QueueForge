name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: queueforge
          POSTGRES_PASSWORD: queueforge
          POSTGRES_DB: queueforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U queueforge" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      QF_ENV: test
      QF_SECRET_KEY: ci-only-secret-0123456789abcdef0123456789
      QF_DATABASE_URL: postgresql+asyncpg://queueforge:queueforge@127.0.0.1:5432/queueforge_test
      QF_REDIS_URL: redis://127.0.0.1:6379/0
      QF_TEST_DATABASE_URL: postgresql+asyncpg://queueforge:queueforge@127.0.0.1:5432/queueforge_test
      QF_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check queueforge tests
          ruff format --check queueforge tests
      - name: Type check
        run: mypy queueforge
      - name: Migrations apply cleanly (upgrade, downgrade, upgrade)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: OpenAPI document is up to date
        run: |
          queueforge openapi
          git diff --exit-code openapi.json
      - name: Tests (real PostgreSQL and Redis)
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Generated API types match the OpenAPI document
        run: |
          npm run gen:api
          git diff --exit-code src/lib/openapi.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      QF_SECRET_KEY: ci-only-secret-0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Smoke test the stack
        run: |
          docker compose up -d
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/readyz && break
            sleep 2
          done
          curl -fsS http://localhost:8000/readyz
          curl -fsS -o /dev/null http://localhost:3000/login
          docker compose ps
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
