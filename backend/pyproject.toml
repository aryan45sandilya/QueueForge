[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "queueforge"
version = "0.1.0"
description = "Self-hostable distributed background job processing platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "redis>=5.2",
  "argon2-cffi>=23.1",
  "croniter>=3.0",
  "structlog>=24.4",
  "psutil>=6.0",
  "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.13",
]

[project.scripts]
queueforge = "queueforge.cli:main"

[tool.setuptools.packages.find]
include = ["queueforge*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
ignore = [
  "S101",   # asserts are fine in tests and for type narrowing
  "S311",   # random is used for jitter and demo data, not cryptography
  "RUF012",
  "B008",   # FastAPI Depends() in defaults
  "E501",   # line length is handled by `ruff format`; long SQL/strings are left intact
  "ASYNC109", # explicit timeout parameters are part of these APIs
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S603", "ASYNC110"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import `tests.conftest` / `tests.helpers`; make that work for both `pytest` and `python -m pytest`.
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
